# Atlas backend — Render.com
# Deploy: connect repo, set root directory to atlas-backend, or use Blueprint.

services:
  - type: web
    name: atlas-backend
    runtime: python
    rootDir: atlas-backend
    plan: free
    buildCommand: pip install -r requirements.txt && python scripts/generate_docker_models.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_HOURS
        value: 8
      - key: DATABASE_URL
        fromDatabase:
          name: atlas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: REDIS_URL
        sync: false

databases:
  - name: atlas-db
    plan: free
    databaseName: atlas_db
    user: atlas
